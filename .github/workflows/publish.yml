name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  distributions:
    uses: ./.github/workflows/distributions.yml

  publish:
    needs: distributions
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
