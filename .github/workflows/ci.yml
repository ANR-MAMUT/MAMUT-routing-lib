name: CI

on:
  push:
    branches: [main, "dev/*-ci"]
  pull_request:

permissions:
  contents: read

jobs:
  editable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native build dependencies
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libboost-dev libgmp-dev
      - name: Install the editable library and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: Test the editable library and the C++ consumer
        run: bash .github/test-install.sh .

  distributions:
    uses: ./.github/workflows/distributions.yml
